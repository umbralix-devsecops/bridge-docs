# ── Superficie de API publicada ───────────────────────────────────────────
# Dos caras, dos credenciales independientes y no intercambiables (SEC-BS-09).
api_surface:
  ingest:                       # Service JWT · aud: portal-ingest-api · scope catalog:ingest
    consumer: microservicio de integraciones de SinsaTools
    contract: 05_contratos_api/ingesta/ingest_catalog_v1.0.yaml
    endpoints:
      - POST /v1/auth/token
      - POST /v1/ingest/catalog
      - GET /v1/ingest/{ingestId}
      - GET /v1/ingest/watermark
  portal:                       # User JWT · aud: portal-api · claim perms{}
    consumer: frontend Angular (Sin-PortalVideos)
    contract: los seis api_*.yaml, en portal-docs
    endpoint_count: 27
    endpoint_groups:
      - /auth/**                # login, register, refresh, logout
      - /catalog/**             # products, products/{id}, versions/{id}/media
      - /media/{id}/access
      - /media/{id}/stream
      - /admin/**              # users, groups, logs, sync
  ops:
    endpoints:
      - GET /health
  retired:                      # sin objeto desde ADR-BS-005 y ADR-BS-006
    - GET /v1/softwares
    - GET /v1/media/updates
    - POST /v1/sync
    - GET /v1/sync/{syncId}

# ── Estado de decisiones ──────────────────────────────────────────────────
open_decisions:
  - id: DEC-BS-03
    priority: medium
    summary: Ratificar la política de purga — 90 días, los fallos un año
    blocks: [DT-BS-02]
    target: v1.1
  - id: DEC-BS-05
    priority: low
    summary: Rotación del client_secret de ingesta sin ventana de indisponibilidad
    target: v1.2
  - id: DEC-BS-07
    priority: critical
    summary: Qué hace POST /admin/sync sin una base que consultar
    blocks: [RF-BS-20, panel de sincronización del portal]
    note: "Mientras tanto se apaga con features.triggerSync: false en config.json."
  - id: DEC-BS-08
    priority: high
    summary: "webPlatformId y deviceType: ¿filtran contenido o son informativos?"
    blocks: [ingest_catalog_v1.0.yaml, semántica del catálogo]
  - id: DEC-BS-09
    priority: high
    summary: Intervalo esperado de ingesta, del que salen el umbral de frescura y la alerta
    blocks: [RNF-BS-09, alertas de la sección 09]
    requires: acuerdo con el equipo de SinsaTools
  - id: DEC-BS-10
    priority: medium
    summary: "sizeBytes: ¿lo entrega el emisor o lo obtenemos por HEAD?"
    blocks: [DT-BS-07]
  - id: DEC-BS-11
    priority: critical
    summary: Añadir GET /media/{id}/access al contrato del portal (api_media.yaml)
    blocks: [RF-BS-19]
    requires: acuerdo con el contrato del frontend
  - id: DEC-BS-12
    priority: medium
    summary: ¿Se funden bridge-docs y portal-docs en una sola documentación?
    note: "Mientras no se decida, el sufijo -BS sigue siendo necesario."
  - id: DEC-BS-13
    priority: high
    summary: "sessions: ¿se añaden replaced_by_session_id y revoked_reason?"
    note: >
      Sin replaced_by_session_id no hay cadena que recorrer al detectar un refresh token ya
      rotado, y el sistema expulsa a la víctima en vez de al ladrón.

closed_decisions:
  - id: DEC-BS-06
    closed_at: "2026-09-16"
    resolution: >
      industry viene de SinsaTools como atributo del software. Campo obligatorio del contrato
      de ingesta.
  - id: DEC-BS-01
    status: sin_objeto
    resolution: "Frecuencia del sync interno. No hay sync: el dato entra por empuje."
  - id: DEC-BS-02
    status: sin_objeto
    resolution: "Conectividad Azure ↔ on-premise. No hay tramo de red que resolver."
  - id: DEC-BS-04
    status: sin_objeto
    resolution: "Marcar registros como sincronizados en on-premise. No escribimos allí."

technical_debt:
  - id: DT-BS-02
    impact: medium
    summary: Política de purga propuesta pero sin barrido implementado
  - id: DT-BS-04
    impact: medium
    summary: >
      Sin métrica de deriva frente a SinsaTools. Mitigada en parte por la foto completa
      (RF-BS-14); era impacto alto
  - id: DT-BS-06
    impact: low
    reduced_on: "2026-09-18"
    summary: >
      Escribir la entrada del changelog sigue siendo humano. El identificador MIG_BS_NNN ya
      lo exige el build por el nombre del archivo, asi que el olvido de la entrada es visible
      en cualquier diff. Antes el gate humano era todo; ahora es el ultimo eslabon.
  - id: DT-BS-07
