  - path: Mapa_Subproyectos.adoc
    title: Mapa de subproyectos
    status: vigente
  - path: README.md
    title: Puerta de entrada al repositorio
    status: vigente
  - path: _nav.adoc
    title: Fragmento de navegación
    status: vigente
    include_only: true

