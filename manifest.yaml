# ============================================================================
# manifest.yaml — Catálogo legible por máquina de bridge-docs/
# ============================================================================
# Fuente de verdad para agentes y scripts sobre qué documentos existen,
# cuáles están vigentes y cómo se relacionan entre sí.
#
# REGLA: al mover, renombrar o superar un documento, actualizar este archivo
# EN EL MISMO COMMIT que el cambio. Un manifest desactualizado es peor que
# no tener manifest.
#
# 2026-09-16 — ADR-BS-005 y ADR-BS-006 cambian la arquitectura: el Bridge
# Service es el backend del portal y el catálogo entra por empuje. Desaparecen
# el SyncWorker, el OnPremiseDbContext, la conectividad corporativa y los
# endpoints /v1/softwares, /v1/media/updates, POST /v1/sync y GET /v1/sync/{id}.
# ============================================================================

project:
  name: Bridge Service
  repo_docs: bridge-docs
  repo_code: Sin-PortalBridge
  counterpart:
    name: Portal de Videos
    repo_docs: portal-docs
    repo_code: [Sin-PortalVideos]
  updated_at: "2026-09-16"
  adr_prefix_rationale: >
    Se usa ADR-BS-NNN en vez del ADR-NNN del Glosario del portal porque bridge-docs tiene su
    propio 11_gestion_producto/adr/ y ambos conjuntos se leen juntos. Confirmado 2026-08-22.
    Desde ADR-BS-005 ambas documentaciones describen un único sistema —el frontend Angular y
    este servicio—, pero mientras sigan siendo dos repositorios el sufijo es necesario.
    Fundirlas está registrado como DEC-BS-12.
  documentation_progress: "~30%"
  team_size: 1

conventions:
  narrative_format: asciidoc
  api_contracts: openapi-3.1-yaml
  standalone_diagrams: mermaid
  embedded_diagrams: "[source,mermaid] dentro del .adoc"
  file_naming: lowercase_snake_con_version
  folder_naming: NN_lowercase
  adr_prefix: ADR-BS-          # prefijo propio para no colisionar con portal-docs
  language_policy:             # adoptada 2026-08-23, revisada 2026-09-16
    code: en                   # BD, clases, componentes, endpoints, campos de contrato, tests
    docs: es                   # prosa, nombres de archivo, carpetas NN_, IDs de trazabilidad
    code_comments: es
    diagram_actor_labels: es
    diagram_component_names: en
    exception: >
      Los nombres de campo de los dos contratos bilaterales son intocables: el de ingesta
      (ingest_catalog_v1.0.yaml) y los seis api_*.yaml del frontend, ya implementados del lado
      del cliente (REST-BS-11). Se usan tal cual, en camelCase inglés, aunque no sigan la
      convención interna. Decae la excepción anterior sobre el esquema on-premise de terceros
      (Products, Stock_Keeping_Units, Images, Entity_Files, Files): ya no se accede a él.

root_documents:
  - path: index.adoc
    title: Índice general
    status: vigente
  - path: 00_Estado_Actual.adoc
    title: Estado Actual
    status: vigente
    living_document: true
    read_first: true
  - path: Analisis_Arranque_Bridge_v1.0.adoc
